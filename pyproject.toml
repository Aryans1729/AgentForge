[project]
name = "enterprisegym"
version = "0.1.0"
description = "A stateful simulated insurance enterprise for evaluating tool-using AI agents"
authors = [
    { name = "Aryan Sharma", email = "aryanksharma1729@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.4",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.8",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires a running PostgreSQL (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
